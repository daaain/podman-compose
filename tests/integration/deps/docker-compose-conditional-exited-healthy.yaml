version: "3.7"
services:
  exits:
    image: nopush/podman-compose-test
    command: ["sh", "-c", "exit 3"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
  should_not_start:
    image: nopush/podman-compose-test
    command: ["sh", "-c", "sleep 3600"]
    depends_on:
      exits:
        condition: service_healthy
